name: Build ViVeTool-GUI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Restore NuGet packages
        run: nuget restore ViVeTool_GUI.sln
      
      - name: Build solution (Release x64)
        run: msbuild ViVeTool_GUI.sln /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\x64\Release\ /m
      
      - name: Upload ViVeTool-GUI executable
        uses: actions/upload-artifact@v4
        with:
          name: ViVeTool-GUI-Release-x64
          path: vivetool-gui/bin/x64/Release/ViVeTool_GUI.exe
          if-no-files-found: error
      
      - name: Upload ViVeTool-GUI FeatureScanner executable
        uses: actions/upload-artifact@v4
        with:
          name: ViVeTool-GUI-FeatureScanner-Release-x64
          path: ViVeTool-GUI.FeatureScanner/bin/x64/Release/ViVeTool_GUI.FeatureScanner.exe
          if-no-files-found: error
      
      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ViVeTool-GUI-Complete-Build
          path: |
            vivetool-gui/bin/x64/Release/
            ViVeTool-GUI.FeatureScanner/bin/x64/Release/
          if-no-files-found: error
